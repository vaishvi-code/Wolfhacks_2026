[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nc-survival-geo"
version = "0.1.0"
description = "OSM road networks, destination discovery, and extensible routing"
requires-python = ">=3.9"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["survival_geo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
